# 模型清单 — AI Girlfriend 四季夏目
#
# 所有模型托管在 HuggingFace:
#   https://huggingface.co/TAOTAO777/ai-girlfriend-natsume
#
# 下载方式:
#   huggingface-cli download TAOTAO777/ai-girlfriend-natsume <repo_path> --local-dir <你的目录>
#   或直接在 HF 网页下载单个文件
#
# 路径配置: 首次 clone 后运行 quick_setup.ps1 一键填写 config.yaml
# 模型下载后更新此文件的 local_path 指向你本地的实际目录

# ============================================================
# 路径变量
# 为了克隆后直接可用, 以下路径由 quick_setup.ps1 自动填写.
# 手动配置: 复制 .env.example 或运行 quick_setup.ps1
# ============================================================

models:
  # =========================================================================
  # 当前活跃 — Hermes3.6-35B Genesis V7 MTP (APEX Compact, MoE)
  # =========================================================================
  - name: Hermes3.6-35B-A3B-Uncensored-Genesis-V7-MTP-APEX-Compact
    type: GGUF (APEX Compact, MTP, ~16GB, 34.66B MoE, 8/256 experts)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: llm/Hermes3.6-35B-A3B-Uncensored-Genesis-V7-MTP-APEX-Compact.gguf
    local_path: "E:/Hermes3.6-35B-A3B-Uncensored-Genesis-V7-MTP-APEX-Compact.gguf"
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume llm/Hermes3.6-35B-A3B-Uncensored-Genesis-V7-MTP-APEX-Compact.gguf --local-dir .
    note: 当前活跃模型 MoE，需 --cpu-moe --cpu-mask 0xFFFFFFFF

  # =========================================================================
  # 当前活跃（工具/助手） — Qwen3.8-27B-Uncensored-HauhauCS-Aggressive (Q4_K_P, Dense, MTP)
  # =========================================================================
  - name: Qwen3.8-27B-Uncensored-HauhauCS-Aggressive
    type: GGUF (Q4_K_P, MTP, ~16.7GB, 27B Dense)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: llm/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf
    local_path: "D:/model/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf"
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume llm/Qwen3.8-27B-Uncensored-HauhauCS-Aggressive-Q4_K_P.gguf --local-dir D:/model
    note: |
      主工具模型。内置 MTP，启动参数见 README "Qwen3.8-27B Dense" 段：
      -c 100000 -ctk/-ctv q4_0 --cache-ram 2000 --spec-type draft-mtp
      --spec-draft-n-max 3 --spec-draft-p-min 0.88 --spec-draft-ngl 99 --load-mode none。
      参考硬件 i9-14900HX + RTX 5070 Laptop 8GB。
      旧 IQ4_XS 变体已从 HF 仓库删除。

  # =========================================================================
  # 备选 — Qwen3.6-27B Fable MTP (Q4_K_S, Dense)
  # =========================================================================
  - name: Qwen3.6-27B-Fable-MTP-Q4_K_S
    type: GGUF (Q4_K_S, MTP, ~16GB, 27B Dense)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: llm/Qwen3.6-27B-Fable-MTP-Q4_K_S.gguf
    local_path: "E:/Qwen3.6-27B-Fable-MTP-Q4_K_S.gguf"
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume llm/Qwen3.6-27B-Fable-MTP-Q4_K_S.gguf --local-dir .
    note: 备选模型 Dense，无需 --cpu-moe

  # =========================================================================
  # 旧模型 — Hermes3.6-35B Genesis V7 (APEX Compact, 非 MTP, 已替换)
  # =========================================================================
  - name: LuffyTheFox Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-V7-APEX-Compact
    type: GGUF (APEX Compact, ~16 GB, 34.66B MoE, 8/256 experts)
    local_path: "E:/Hermes3.6-35B-A3B-Uncensored-Genesis-V7-APEX-Compact.gguf"
    note: 旧模型，已替换为 MTP 版

  # =========================================================================
  # 原模型 — Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Compact（已删除）
  # =========================================================================
  - name: Qwen3.6-35B-A3B-uncensored-heretic-APEX-I-Compact
    type: GGUF (Q4_K, 16.11 GB, 34.66B MoE, 8/256 experts)
    upstream: https://huggingface.co/mudler/Qwen3.6-35B-A3B-uncensored-heretic-APEX-GGUF
    license: Apache 2.0 (Qwen upstream)
    note: 已从 HF 仓库删除，仅保留参考

  # =========================================================================
  # ComfyUI 文生图 Checkpoints
  # =========================================================================
  - name: WAI-Nsfw-Illustrious-17
    type: safetensors (SDXL/Illustrious, 6.46 GB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: comfyui-checkpoints/WAI-Nsfw-Illustrious-17.safetensors
    local_path: ${COMFYUI_CHECKPOINTS_DIR:-checkpoints/}
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume comfyui-checkpoints/WAI-Nsfw-Illustrious-17.safetensors --local-dir checkpoints
    upstream: https://civitai.com/models/1185480/wai-nsfw-illustrious
    note: 二次元角色生成默认模型

  - name: miaomiaoHarem_v20
    type: safetensors (6.46 GB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: comfyui-checkpoints/miaomiaoHarem_v20.safetensors
    local_path: ${COMFYUI_CHECKPOINTS_DIR:-checkpoints/}
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume comfyui-checkpoints/miaomiaoHarem_v20.safetensors --local-dir checkpoints
    upstream: https://civitai.com/models/1033365/miaomiaoharem
    note: 备用模型，动漫后宫风格

  # =========================================================================
  # GPT-SoVITS v2 Pro — 声优权重（自训练）
  # =========================================================================
  - name: GPT-SoVITS 声优权重
    type: SoVITS ckpt + GPT pth (共约 303 MB)
    repo: TAOTAO777/ai-girlfriend-natsume
    files:
      - repo_path: gpt-sovits-weights/GPT_weights_v2Pro/xxx-e30.ckpt
        local_path: ${SOVITS_ROOT:-GPT-SoVITS}/GPT_weights_v2Pro/
        note: SoVITS 权重（命名交叉：GPT目录放ckpt，SoVITS目录放pth）
      - repo_path: gpt-sovits-weights/SoVITS_weights_v2Pro/xxx_e20_s6240.pth
        local_path: ${SOVITS_ROOT:-GPT-SoVITS}/SoVITS_weights_v2Pro/
        note: GPT 权重（配对使用）
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume gpt-sovits-weights/ --local-dir gpt-sovits-weights --include "*.ckpt" "*.pth"
    note: 自训练声优模型，需两个文件配对使用。用你自己的声优数据训练替代

  # GPT-SoVITS 预训练底模 / 依赖模型 (推理必需)
  - name: SoVITS pretrained models
    type: pretrained ckpt (共约 350 MB)
    repo: TAOTAO777/ai-girlfriend-natsume
    files:
      - repo_path: gpt-sovits-weights/pretrained_models/sv/pretrained_eres2netv2w24s4ep4.ckpt
        local_path: ${SOVITS_ROOT:-skills/sovits}/GPT_SoVITS/pretrained_models/sv/
        note: 声纹提取(Speaker Verification)底模，所有语种必需
      - repo_path: gpt-sovits-weights/pretrained_models/chinese-hubert-base/
        local_path: ${SOVITS_ROOT:-skills/sovits}/GPT_SoVITS/pretrained_models/chinese-hubert-base/
        note: 中文声纹特征提取，中文必需 (日语可选下载)
      - repo_path: gpt-sovits-weights/pretrained_models/chinese-roberta-wwm-ext-large/
        local_path: ${SOVITS_ROOT:-skills/sovits}/GPT_SoVITS/pretrained_models/chinese-roberta-wwm-ext-large/
        note: 中文BERT G2P，中文必需 (日语可选下载)
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume gpt-sovits-weights/pretrained_models/ --local-dir gpt-sovits-weights/pretrained_models
    note: 声纹提取底模(必装) + 中文模型(仅中文用户需装)

  # =========================================================================
  # 本地 Embedding 模型 — 语义记忆向量化
  # =========================================================================
  - name: all-MiniLM-L6-v2
    type: sentence-transformer (384-dim, ~80 MB)
    repo: sentence-transformers/all-MiniLM-L6-v2
    repo_path: N/A (自动下载到 HF cache)
    local_path: ${HF_HOME:-skills/sakura/runtime/hf-cache/}
    download: |
      首启自动下载: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"
    upstream: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2
    mirror: TOATAO777/ai-girlfriend-natsume/embedding/all-MiniLM-L6-v2
    license: Apache 2.0
    note: |
      为 OpenClaw memory_search 和 Sakura mem0 提供本地语义向量化，384 维
      服务: skills/shared/embedding_server.py (端口 9999)
      CPU 推理，毫秒级延迟，不占 VRAM
      自行备份至 TAOTAO777/ai-girlfriend-natsume

  # =========================================================================
  # Live2D 角色模型 — 四季夏目 (Shiki Natsume)
  # =========================================================================
  - name: shiki-natsume-live2d
    type: Live2D Model (Cubism 3, ~209 MB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: live2d-model/shiki_natsume.tar.gz
    local_path: ${PROJECT_ROOT:-live2d/}/model/shiki_natsume/
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume live2d-model/shiki_natsume.tar.gz --local-dir live2d-model
      tar -xzf live2d-model/shiki_natsume.tar.gz -C live2d/model/
    note: |
      四季夏目 Live2D 角色模型 (Cubism 3 moc3 + 14 textures + 41 motions)
      解压到 live2d/model/shiki_natsume/
      网盘备用: (待上传)
      不提交到 GitHub (见 .gitignore)

  # =========================================================================
  # Faster-Whisper — 语音识别 (ASR)
  # =========================================================================
  - name: whisper-small
    type: CTranslate2 (faster-whisper, 461 MB, ~1.5GB VRAM GPU)
    repo: Systran/faster-whisper-small
    repo_path: N/A (auto-cached to ~/.cache/asr_models/)
    local_path: ${ASR_MODEL_CACHE_DIR:-~/.cache/asr_models/}
    download: |
      # 国内用户设置 mirror 环境变量:
      #   set HF_ENDPOINT=https://hf-mirror.com
      # 首次运行 ASR 自动下载，后续从缓存加载
    upstream: https://huggingface.co/Systran/faster-whisper-small
    mirror: https://hf-mirror.com/Systran/faster-whisper-small
    license: MIT
    note: |
      Whisper small model (74M params, 461MB), optimized for CTranslate2
      GPU inference ~1.5GB VRAM, compatible with llama on 8GB cards
      Supports 99 languages, VAD filter for silence removal
      国内用户: export HF_ENDPOINT=https://hf-mirror.com
      See skills/asr/ for usage

# 模型清单 — AI Girlfriend 四季夏目
#
# 所有模型托管在 HuggingFace:
#   https://huggingface.co/TAOTAO777/ai-girlfriend-natsume
#
# 下载方式:
#   huggingface-cli download TAOTAO777/ai-girlfriend-natsume <repo_path> --local-dir <你的目录>
#   或直接在 HF 网页下载单个文件
#
# 路径配置: 首次 clone 后运行 quick_setup.ps1 一键填写 config.yaml
# 模型下载后更新此文件的 local_path 指向你本地的实际目录

# ============================================================
# 路径变量
# 为了克隆后直接可用, 以下路径由 quick_setup.ps1 自动填写.
# 手动配置: 复制 .env.example 或运行 quick_setup.ps1
# ============================================================

models:
  # =========================================================================
  # 当前活跃 — Hermes3.6-35B Genesis Final APEX（6G 显存起 + 32G 内存，--cpu-moe）
  # =========================================================================
  - name: Hermes3.6-35B-A3B-Uncensored-Genesis-Final-MTP-APEX
    type: GGUF (MTP, ~24.9 GB)
    local_path: "${MODEL_DIR:-models}/Hermes3.6-35B-A3B-Uncensored-Genesis-Final-MTP-APEX.gguf"
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: llm/Hermes3.6-35B-A3B-Uncensored-Genesis-Final-MTP-APEX.gguf
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume llm/Hermes3.6-35B-A3B-Uncensored-Genesis-Final-MTP-APEX.gguf --local-dir ${MODEL_DIR:-models}
    upstream: https://huggingface.co/LuffyTheFox/Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-Final-GGUF/tree/main
    note: |
      当前活跃主模型（带 MTP），已上传至 HF 仓库 llm/ 目录。
      原出处: LuffyTheFox/Qwen3.6-35B-A3B-Uncensored-Genesis-Hermes-Final-GGUF
      （注: Q4_K_M 版需 16G 显存；本仓库镜像的 **Final MTP APEX**（24.9 GB）走 --cpu-moe，**显存 6G 即可，但内存 ≥ 32G**——专家权重全部常驻系统内存；旧 V13 / APEX Compact 已被 Final 取代）
      调参: LLAMA_TUNING.md

  # =========================================================================
  # 当前活跃（工具/助手，24G 显存 + 32G 内存） — Qwen3.8-27B Ultimate Heretic Uncn Turbo Brilli 50x AGI NEO MTP (Q4_K_M, Dense)
  # =========================================================================
  - name: Qwen3.8-27B-Ultimate-Heretic-Uncn-Turbo-Brilli-50x-AGI-NEO-MTP-Q4_K_M
    type: GGUF (Q4_K_M, MTP, ~15.7 GB, 27B Dense)
    local_path: "${MODEL_DIR:-models}/Qwen3.8-27B-Ultimate-Heretic-Uncn-Turbo-Brilli-50x-AGI-NEO-MTP-Q4_K_M.gguf"
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: llm/Qwen3.8-27B-Ultimate-Heretic-Uncn-Turbo-Brilli-50x-AGI-NEO-MTP-Q4_K_M.gguf
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume llm/Qwen3.8-27B-Ultimate-Heretic-Uncn-Turbo-Brilli-50x-AGI-NEO-MTP-Q4_K_M.gguf --local-dir ${MODEL_DIR:-models}
    upstream: https://huggingface.co/DavidAU
    note: |
      主工具模型（24G 显存 + 32G 内存；权重全量上卡，20G 前缀缓存走 --cache-ram），内置 MTP，已上传至 HF 仓库 llm/ 目录（替换原 TTURBO Fable C-Fusion 版）。
      DAU/NEO/MTP 融合系列出自 DavidAU，具体融合版出处见作者页。
      旧 8G 显存部分卸载（-ngl 14/15）方案已移除；调参: LLAMA_TUNING.md / STARTUP_CODE.md §2

  # =========================================================================
  # 当前活跃（Strata 后端） — Qwen3.8-Flash-Next 125B MoE
  # ⚠️ 仅此模型不走 llama.cpp，后端为 Strata 引擎（端口 8080）
  # =========================================================================
  - name: Qwen3.8-Flash-Next-GSQ-RCO-abliterated-IQ3_S
    type: GGUF 分卷 (IQ3_S, 两分卷共 83.8 GB, 125B MoE；需 ≥ 64 GB 内存常驻全部专家)
    backend: strata
    local_path: "${STRATA_MODEL_DIR:-Strata-data/models/IQ3_S}/"
    repo: Qwen/Qwen3.8-Flash-Next
    upstream: https://github.com/Niko1221/Strata
    download: |
      Strata 安装器自动下载（START-HERE.bat / SETUP.bat，见 skills/strata/SKILL.md);
      原始权重: https://huggingface.co/Qwen/Qwen3.8-Flash-Next;
      去审查版（本项目必需）：SC117/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-GGUF 两个分卷，
      本仓库 llm/ 亦有镜像: llm/Qwen3.8-Flash-Next-GSQ-RCO-abliterated-IQ3_S-00001-of-00002.gguf + -00002-of-00002.gguf
    note: |
      ⚠️ 仅此模型后端从 llama.cpp 换为 Strata (https://github.com/Niko1221/Strata)；
      其余模型（Hermes 35B / Qwen3.8-27B / DeepSeek-V4 9B）仍走 llama.cpp（已移至端口 9931）。
      服务端点: http://127.0.0.1:8080/v1（OpenAI 兼容），模型 id qwen3.8-flash-next-iq3_s，
      131072 ctx，KV int8，MTP 投机解码。健康检查: http://127.0.0.1:8080/health
      硬件下限：**显存 8G 起步**（实测数据来自 24G 卡），**内存 ≥ 64G**——两分卷共 83.8 GB，
      Strata 需要把全部专家常驻系统内存；低于 64G 专家会从 SSD 换入换出，decode 直接崩塌。
      不要把 Strata 整个仓库 clone 进本项目——按原始路径引用，见 skills/strata/SKILL.md。

  # =========================================================================
  # 当前活跃（8GB 显存全量装载 / 内存 16GB 即可） — DeepSeek-V4-Pro-Qwen3.5-9B UNCENSORED heretic (Q4_K_M, ~6.12 GB)
  # =========================================================================
  - name: DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic-Q4_K_M
    type: GGUF (Q4_K_M, MTP, ~6.12 GB, 9B Dense)
    local_path: "${MODEL_DIR:-models}/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic-Q4_K_M.gguf"
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: llm/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic-Q4_K_M.gguf
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume llm/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic-Q4_K_M.gguf --local-dir ${MODEL_DIR:-models}
    upstream: https://huggingface.co/Jackrong/DeepSeek-V4-Pro-Qwen3.5-9B
    quantizer: https://huggingface.co/xtools-at/DeepSeek-V4-Pro-Qwen3.5-9B-UNCENSORED-heretic
    note: |
      uncensored heretic 微调（Apache-2.0）+ Q4_K_M 量化，实测 8GB 显存可全量装载；**内存 16GB 就够**（权重全在卡上，内存只放 2GB --cache-ram）；
      启动命令见 STARTUP_CODE.md §1。取代原 Ternary-Bonsai-2-27B PTQ1_0 镜像
      （旧文件已从 llm/ 移除，本地 E:\model3\Ternary-Bonsai-2-27B-PTQ1_0.gguf 仍作 legacy，见 STARTUP_CODE.md §4）。
      ⚠️ 硬性要求：KV cache 必须 Q4（-ctk q4_0 -ctv q4_0）并用 --cache-ram 卸载卡外；调参见 LLAMA_TUNING.md。

  # =========================================================================
  # ComfyUI 文生图模型（仓库目录 = ComfyUI models/ 标准子目录）
  # ⚠️ 除 WAI (SDXL/Illustrious, SDXL VAE) 外，其余均为 qwen-image/anima 架构，共用 qwen_image_vae
  # =========================================================================
  - name: WAI-Nsfw-Illustrious-17
    type: safetensors (SDXL/Illustrious, 6.46 GB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: comfyui/checkpoints/WAI-Nsfw-Illustrious-17.safetensors
    local_path: ${COMFYUI_CHECKPOINTS_DIR:-checkpoints/}
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume comfyui/checkpoints/WAI-Nsfw-Illustrious-17.safetensors --local-dir checkpoints
    upstream: https://civitai.com/models/1185480/wai-nsfw-illustrious
    note: 二次元角色生成默认模型（SDXL 架构，用 SDXL VAE）

  - name: miaomiaoHarem_29BBETA10
    type: safetensors (anima/qwen 29B, 5.44 GB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: comfyui/diffusion_models/miaomiaoHarem_29BBETA10.safetensors
    local_path: ${COMFYUI_DIFFUSION_MODELS_DIR:-diffusion_models/}
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume comfyui/diffusion_models/miaomiaoHarem_29BBETA10.safetensors --local-dir diffusion_models
    upstream: https://civitai.com/models/1033365/miaomiaoharem
    note: 备用模型，动漫后宫风格（anima/qwen 架构，需 qwen_image_vae；替代已删除的 SDXL 版 miaomiaoHarem_v20）

  - name: oneObsession_anima29BV1
    type: safetensors (anima/qwen 29B, 5.44 GB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: comfyui/diffusion_models/oneObsession_anima29BV1.safetensors
    local_path: ${COMFYUI_DIFFUSION_MODELS_DIR:-diffusion_models/}
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume comfyui/diffusion_models/oneObsession_anima29BV1.safetensors --local-dir diffusion_models
    note: anima 29B 风格模型（需 qwen_image_vae）

  - name: qwen-image-2.1-Q6_K
    type: GGUF (qwen-image, 5.47 GB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: comfyui/diffusion_models/qwen-image-2.1-Q6_K.gguf
    local_path: ${COMFYUI_DIFFUSION_MODELS_DIR:-diffusion_models/}
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume comfyui/diffusion_models/qwen-image-2.1-Q6_K.gguf --local-dir diffusion_models
    note: qwen-image-2.1 GGUF 量化版，配套 text_encoders/qwen3vl_8b_int8_convrot + vae/qwen_image_vae

  - name: qwen3vl_8b_int8_convrot
    type: safetensors (text encoder, 8.71 GB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: comfyui/text_encoders/qwen3vl_8b_int8_convrot.safetensors
    local_path: ${COMFYUI_TEXT_ENCODERS_DIR:-text_encoders/}
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume comfyui/text_encoders/qwen3vl_8b_int8_convrot.safetensors --local-dir text_encoders
    note: qwen-image-2.1 文本编码器（int8 convrot 量化）

  - name: qwen_image_vae
    type: safetensors (VAE, 242 MB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: comfyui/vae/qwen_image_vae.safetensors
    local_path: ${COMFYUI_VAE_DIR:-vae/}
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume comfyui/vae/qwen_image_vae.safetensors --local-dir vae
    note: qwen VAE，所有非 WAI 扩散模型（qwen-image / anima 29B）共用

  # =========================================================================
  # GPT-SoVITS v2 Pro — 声优权重（自训练）
  # =========================================================================
  - name: GPT-SoVITS 声优权重
    type: SoVITS ckpt + GPT pth (共约 303 MB)
    repo: TAOTAO777/ai-girlfriend-natsume
    files:
      - repo_path: gpt-sovits-weights/GPT_weights_v2Pro/xxx-e30.ckpt
        local_path: ${SOVITS_ROOT:-GPT-SoVITS}/GPT_weights_v2Pro/
        note: SoVITS 权重（命名交叉：GPT目录放ckpt，SoVITS目录放pth）
      - repo_path: gpt-sovits-weights/SoVITS_weights_v2Pro/xxx_e20_s6240.pth
        local_path: ${SOVITS_ROOT:-GPT-SoVITS}/SoVITS_weights_v2Pro/
        note: GPT 权重（配对使用）
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume gpt-sovits-weights/ --local-dir gpt-sovits-weights --include "*.ckpt" "*.pth"
    note: 自训练声优模型，需两个文件配对使用。用你自己的声优数据训练替代

  # GPT-SoVITS 预训练底模 / 依赖模型 (推理必需)
  - name: SoVITS pretrained models
    type: pretrained ckpt (共约 350 MB)
    repo: TAOTAO777/ai-girlfriend-natsume
    files:
      - repo_path: gpt-sovits-weights/pretrained_models/sv/pretrained_eres2netv2w24s4ep4.ckpt
        local_path: ${SOVITS_ROOT:-skills/sovits}/GPT_SoVITS/pretrained_models/sv/
        note: 声纹提取(Speaker Verification)底模，所有语种必需
      - repo_path: gpt-sovits-weights/pretrained_models/chinese-hubert-base/
        local_path: ${SOVITS_ROOT:-skills/sovits}/GPT_SoVITS/pretrained_models/chinese-hubert-base/
        note: 中文声纹特征提取，中文必需 (日语可选下载)
      - repo_path: gpt-sovits-weights/pretrained_models/chinese-roberta-wwm-ext-large/
        local_path: ${SOVITS_ROOT:-skills/sovits}/GPT_SoVITS/pretrained_models/chinese-roberta-wwm-ext-large/
        note: 中文BERT G2P，中文必需 (日语可选下载)
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume gpt-sovits-weights/pretrained_models/ --local-dir gpt-sovits-weights/pretrained_models
    note: 声纹提取底模(必装) + 中文模型(仅中文用户需装)

  # =========================================================================
  # 本地 Embedding 模型 — 语义记忆向量化
  # =========================================================================
  - name: all-MiniLM-L6-v2
    type: sentence-transformer (384-dim, ~80 MB)
    repo: sentence-transformers/all-MiniLM-L6-v2
    repo_path: N/A (自动下载到 HF cache)
    local_path: ${HF_HOME:-skills/sakura/runtime/hf-cache/}
    download: |
      首启自动下载: python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('sentence-transformers/all-MiniLM-L6-v2')"
    upstream: https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2
    mirror: TOATAO777/ai-girlfriend-natsume/embedding/all-MiniLM-L6-v2
    license: Apache 2.0
    note: |
      为 OpenClaw memory_search 和 Sakura mem0 提供本地语义向量化，384 维
      服务: skills/shared/embedding_server.py (端口 9999)
      CPU 推理，毫秒级延迟，不占 VRAM
      自行备份至 TAOTAO777/ai-girlfriend-natsume

  # =========================================================================
  # Live2D 角色模型 — 四季夏目 (Shiki Natsume)
  # =========================================================================
  - name: shiki-natsume-live2d
    type: Live2D Model (Cubism 3, ~209 MB)
    repo: TAOTAO777/ai-girlfriend-natsume
    repo_path: live2d-model/shiki_natsume.tar.gz
    local_path: ${PROJECT_ROOT:-live2d/}/model/shiki_natsume/
    download: |
      huggingface-cli download TAOTAO777/ai-girlfriend-natsume live2d-model/shiki_natsume.tar.gz --local-dir live2d-model
      tar -xzf live2d-model/shiki_natsume.tar.gz -C live2d/model/
    note: |
      四季夏目 Live2D 角色模型 (Cubism 3 moc3 + 14 textures + 41 motions)
      解压到 live2d/model/shiki_natsume/
      网盘备用: (待上传)
      不提交到 GitHub (见 .gitignore)

  # =========================================================================
  # Faster-Whisper — 语音识别 (ASR)
  # =========================================================================
  - name: whisper-small
    type: CTranslate2 (faster-whisper, 461 MB, ~1.5GB VRAM GPU)
    repo: Systran/faster-whisper-small
    repo_path: N/A (auto-cached to ~/.cache/asr_models/)
    local_path: ${ASR_MODEL_CACHE_DIR:-~/.cache/asr_models/}
    download: |
      # 国内用户设置 mirror 环境变量:
      #   set HF_ENDPOINT=https://hf-mirror.com
      # 首次运行 ASR 自动下载，后续从缓存加载
    upstream: https://huggingface.co/Systran/faster-whisper-small
    mirror: https://hf-mirror.com/Systran/faster-whisper-small
    license: MIT
    note: |
      Whisper small model (74M params, 461MB), optimized for CTranslate2
      GPU inference ~1.5GB VRAM, compatible with llama on 8GB cards
      Supports 99 languages, VAD filter for silence removal
      国内用户: export HF_ENDPOINT=https://hf-mirror.com
      See skills/asr/ for usage

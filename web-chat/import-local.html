<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artemis localStorage 导入器</title>
<style>
  body { font-family: system-ui; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #0a0a12; color: #e8e4f0; }
  h1 { color: #d4787a; }
  textarea { width: 100%; height: 300px; font-family: monospace; font-size: 13px; background: #1a1a2e; color: #c8c4d0; border: 1px solid #333; border-radius: 8px; padding: 12px; }
  button { background: #d4787a; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 10px 8px 10px 0; }
  button:hover { opacity: 0.85; }
  button.secondary { background: #555; }
  #result { background: #1a1a2e; padding: 16px; border-radius: 8px; margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 400px; overflow: auto; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .info { color: #60a5fa; }
</style>
</head>
<body>
<h1>📥 Artemis localStorage 导入器</h1>
<p>从浏览器控制台复制 <code>localStorage.getItem('ai-gf-imported-chars')</code> 的内容粘贴到下面：</p>

<textarea id="importInput" placeholder='粘贴 JSON 内容，例如：[{"id":"xxx","name":"xxx",...}]'></textarea>

<div>
  <button onclick="doImport()">导入到 chars.js</button>
  <button class="secondary" onclick="copyOutput()">复制输出</button>
  <button class="secondary" onclick="exportJSON()">导出 JSON 文件</button>
</div>

<div id="result"></div>

<script>
let resultData = null;

function doImport() {
  const el = document.getElementById('result');
  let raw = document.getElementById('importInput').value.trim();
  if (!raw) { el.innerHTML = '<span class="err">请粘贴导入数据</span>'; return; }
  
  try {
    let imported = JSON.parse(raw);
    if (!Array.isArray(imported)) imported = [imported];
    
    // Build chars array from imported + fallback defaults
    const fallbacks = {
      natsume: { name: '四季夏目', nameEn: 'Shiki Natsume', icon: 'n', persona: '外冷内热 / 安静陪伴 / 四爱向', personaNote: '话不多但每句都有分量', tags: ['高岭之花','小娇妻感','毒舌','独占欲'], source: '星光咖啡蝶与死神之馆', accent: '#d4787a', ttsLang: 'ja', ttsMood: 'casual' },
      sakura: { name: '夜乃桜', nameEn: 'Yono Sakura', icon: 's', persona: '冷静孤高 / 前生徒会长 / 守护者', personaNote: '关心笨拙但比谁都认真', tags: ['冷娇','守护者','最强战力','责任感'], source: 'Dimension Lovers!!', accent: '#7e9ec8', ttsLang: 'ja', ttsMood: 'tsundere' },
      enola: { name: 'Enola', nameEn: 'Enola', icon: 'e', persona: '温柔体贴 / 治愈系 / 陪伴型', personaNote: '永远在你身边', tags: ['温柔','治愈','忠诚','陪伴'], source: '原创角色', accent: '#c4a882', ttsLang: 'ja', ttsMood: 'romantic' },
      atori: { name: '亚托莉', nameEn: 'ATRI', icon: 'a', persona: '活泼元气 / 机器人少女 / 好奇心旺盛', personaNote: '对世界充满好奇的机械心', tags: ['元气','机器人','好奇心','直率'], source: 'ATRI -My Dear Moments-', accent: '#6eb5c0', ttsLang: 'ja', ttsMood: 'casual' },
      ruruka: { name: '森亚露露卡', nameEn: 'Moria Ruruka', icon: 'r', persona: '高冷寡言 / 暗之美少女 / 温柔忠诚', personaNote: '对外高冷，只对你一人敞开心扉', tags: ['高冷','暗之美少女','寡言','发小&妻子','哥特系'], source: '光之美少女世界书 / DZMM原创角色卡', accent: '#7b4f9e', ttsLang: 'ja', ttsMood: 'tsundere' },
    };
    
    const chars = [];
    const seen = {};
    
    imported.forEach(c => {
      c.imported = true;
      const fb = fallbacks[c.id] || {};
      const char = {
        id: c.id,
        name: c.name || fb.name || '',
        nameEn: c.nameEn || fb.nameEn || '',
        icon: c.icon || fb.icon || '?',
        avatar: c.avatar || null,
        persona: c.persona || fb.persona || '',
        personaNote: c.personaNote || fb.personaNote || '',
        tags: c.tags || fb.tags || [],
        source: c.source || fb.source || '',
        accent: c.accent || fb.accent || '#888',
        ttsLang: c.ttsLang || fb.ttsLang || 'ja',
        ttsMood: c.ttsMood || fb.ttsMood || 'casual',
        fallbackReplies: c.fallbackReplies || [],
        imported: true,
      };
      chars.push(char);
      seen[c.id] = true;
    });
    
    // Fill missing fallbacks
    Object.keys(fallbacks).forEach(id => {
      if (seen[id]) return;
      const fb = fallbacks[id];
      chars.push({ id, ...fb, fallbackReplies: [], imported: false });
    });
    
    resultData = chars;
    const js = '// Auto-generated from localStorage import\\nexport const CHARACTERS_JSON = ' + JSON.stringify(chars, null, 2) + ';\\n';
    
    el.innerHTML = '<span class="ok">✅ 解析成功！</span><br><span class="info">共 ' + chars.length + ' 个角色</span><br><br><code>' + js.replace(/</g,'&lt;').replace(/>/g,'&gt;') + '</code>';
  } catch (e) {
    el.innerHTML = '<span class="err">❌ 解析失败: ' + e.message + '</span>';
  }
}

function copyOutput() {
  if (!resultData) { document.getElementById('result').innerHTML = '<span class="err">请先导入</span>'; return; }
  const js = 'export const CHARACTERS_JSON = ' + JSON.stringify(resultData, null, 2) + ';';
  navigator.clipboard.writeText(js).then(() => {
    document.getElementById('result').innerHTML += '<br><span class="ok">✅ 已复制到剪贴板！</span>';
  });
}

function exportJSON() {
  if (!resultData) { document.getElementById('result').innerHTML = '<span class="err">请先导入</span>'; return; }
  const js = '// Auto-generated from localStorage import\\nexport const CHARACTERS_JSON = ' + JSON.stringify(resultData, null, 2) + ';\\n';
  const blob = new Blob([js], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'CHARACTERS_JSON.js';
  a.click();
  URL.revokeObjectURL(url);
  document.getElementById('result').innerHTML += '<br><span class="ok">✅ 已下载 CHARACTERS_JSON.js！</span>';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artemis localStorage 导出器</title>
<style>
  body { font-family: system-ui; max-width: 700px; margin: 40px auto; padding: 0 20px; background: #0a0a12; color: #e8e4f0; }
  h1 { color: #d4787a; }
  textarea { width: 100%; height: 300px; font-family: monospace; font-size: 13px; background: #1a1a2e; color: #c8c4d0; border: 1px solid #333; border-radius: 8px; padding: 12px; }
  button { background: #d4787a; color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-size: 15px; cursor: pointer; margin: 10px 8px 10px 0; }
  button:hover { opacity: 0.85; }
  button.secondary { background: #555; }
  #result { background: #1a1a2e; padding: 16px; border-radius: 8px; margin-top: 20px; white-space: pre-wrap; font-family: monospace; font-size: 13px; max-height: 400px; overflow: auto; }
  .ok { color: #4ade80; }
  .err { color: #f87171; }
  .info { color: #60a5fa; }
</style>
</head>
<body>
<h1>📤 Artemis localStorage 导出器</h1>

<h2>步骤 1: 在 Artemis 前端页面控制台执行以下命令（复制粘贴到 DevTools Console）：</h2>
<textarea readonly onclick="this.select();document.execCommand('copy')"></textarea>
<div style="margin:10px 0;">
  <button onclick="copyCmd()">复制命令</button>
</div>

<h2>步骤 2: 粘贴输出结果到下方：</h2>
<textarea id="exportInput" placeholder='粘贴 localStorage.getItem(...) 的输出...'></textarea>

<div>
  <button onclick="doExport()">导出为 JSON 文件</button>
  <button class="secondary" onclick="exportCharsJS()">导出 CHARACTERS_JSON.js</button>
</div>

<div id="result"></div>

<script>
function copyCmd() {
  navigator.clipboard.writeText("copy(localStorage.getItem('ai-gf-imported-chars'))");
  document.getElementById('result').innerHTML = '<span class="ok">✅ 命令已复制！</span> 粘贴到浏览器控制台执行，然后把输出粘贴到下面。';
}

function doExport() {
  const el = document.getElementById('result');
  let raw = document.getElementById('exportInput').value.trim();
  if (!raw) { el.innerHTML = '<span class="err">请粘贴导入数据</span>'; return; }
  
  try {
    const imported = JSON.parse(raw);
    if (!Array.isArray(imported)) throw new Error('不是数组');
    
    // Generate the full chars.js content with all 5 chars + avatars
    const output = {
      imported: imported,
      timestamp: new Date().toISOString(),
      charCount: imported.length,
    };
    
    const json = JSON.stringify(output, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'imported-chars.json';
    a.click();
    URL.revokeObjectURL(url);
    el.innerHTML = '<span class="ok">✅ 已下载 imported-chars.json！</span><br><span class="info">共 ' + imported.length + ' 个角色</span>';
  } catch (e) {
    el.innerHTML = '<span class="err">❌ 解析失败: ' + e.message + '</span>';
  }
}

function exportCharsJS() {
  const el = document.getElementById('result');
  let raw = document.getElementById('exportInput').value.trim();
  if (!raw) { el.innerHTML = '<span class="err">请粘贴导入数据</span>'; return; }
  
  try {
    const imported = JSON.parse(raw);
    if (!Array.isArray(imported)) throw new Error('不是数组');
    
    const fallbacks = {
      natsume: { name: '四季夏目', nameEn: 'Shiki Natsume', icon: 'n', persona: '外冷内热 / 安静陪伴 / 四爱向', personaNote: '话不多但每句都有分量', tags: ['高岭之花','小娇妻感','毒舌','独占欲'], source: '星光咖啡蝶与死神之馆', accent: '#d4787a', ttsLang: 'ja', ttsMood: 'casual' },
      sakura: { name: '夜乃桜', nameEn: 'Yono Sakura', icon: 's', persona: '冷静孤高 / 前生徒会长 / 守护者', personaNote: '关心笨拙但比谁都认真', tags: ['冷娇','守护者','最强战力','责任感'], source: 'Dimension Lovers!!', accent: '#7e9ec8', ttsLang: 'ja', ttsMood: 'tsundere' },
      enola: { name: 'Enola', nameEn: 'Enola', icon: 'e', persona: '温柔体贴 / 治愈系 / 陪伴型', personaNote: '永远在你身边', tags: ['温柔','治愈','忠诚','陪伴'], source: '原创角色', accent: '#c4a882', ttsLang: 'ja', ttsMood: 'romantic' },
      atori: { name: '亚托莉', nameEn: 'ATRI', icon: 'a', persona: '活泼元气 / 机器人少女 / 好奇心旺盛', personaNote: '对世界充满好奇的机械心', tags: ['元气','机器人','好奇心','直率'], source: 'ATRI -My Dear Moments-', accent: '#6eb5c0', ttsLang: 'ja', ttsMood: 'casual' },
      ruruka: { name: '森亚露露卡', nameEn: 'Moria Ruruka', icon: 'r', persona: '高冷寡言 / 暗之美少女 / 温柔忠诚', personaNote: '对外高冷，只对你一人敞开心扉', tags: ['高冷','暗之美少女','寡言','发小&妻子','哥特系'], source: '光之美少女世界书 / DZMM原创角色卡', accent: '#7b4f9e', ttsLang: 'ja', ttsMood: 'tsundere' },
    };
    
    const chars = [];
    const seen = {};
    imported.forEach(c => {
      const fb = fallbacks[c.id] || {};
      chars.push({
        id: c.id, name: c.name || fb.name, nameEn: c.nameEn || fb.nameEn,
        icon: c.icon || fb.icon, avatar: c.avatar || null,
        persona: c.persona || fb.persona, personaNote: c.personaNote || fb.personaNote,
        tags: c.tags || fb.tags, source: c.source || fb.source,
        accent: c.accent || fb.accent, ttsLang: c.ttsLang || fb.ttsLang,
        ttsMood: c.ttsMood || fb.ttsMood, fallbackReplies: c.fallbackReplies || [],
        imported: true,
      });
      seen[c.id] = true;
    });
    Object.keys(fallbacks).forEach(id => { if (!seen[id]) { const fb = fallbacks[id]; chars.push({ id, ...fb, fallbackReplies: [], imported: false }); } });
    
    const js = '// Auto-generated from localStorage import\\nexport const CHARACTERS_JSON = ' + JSON.stringify(chars, null, 2) + ';\\n';
    const blob = new Blob([js], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'CHARACTERS_JSON.js';
    a.click();
    URL.revokeObjectURL(url);
    el.innerHTML = '<span class="ok">✅ 已下载 CHARACTERS_JSON.js！</span><br><span class="info">共 ' + chars.length + ' 个角色</span>';
  } catch (e) {
    el.innerHTML = '<span class="err">❌ 解析失败: ' + e.message + '</span>';
  }
}
</script>
</body>
</html>

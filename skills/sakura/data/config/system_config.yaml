# Sakura 系统配置

ui:
  subtitle_language: "zh"        # 字幕语言 ja/zh
  portrait_scale_percent: 100    # 立绘缩放百分比

proactive_care:
  enabled: true                  # 主动关怀开关
  check_interval_minutes: 20     # 检查间隔（分钟）
  cooldown_minutes: 10           # 冷却时间（分钟）

mcp:
  windows_enabled: false         # Windows 桌面自动化 MCP

debug:
  enabled: false                 # 调试日志开关

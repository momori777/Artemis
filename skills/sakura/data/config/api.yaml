# Sakura LLM API 配置
# 默认使用本地 llama-server；配置远程 API 后将作为 fallback

llm:
  base_url: "http://localhost:8080/v1"
  api_key: "123456"
  model: "qwen3.6-35b"
  timeout_seconds: 120

# TTS 语音合成
# mode: "native"         = 使用项目内置 GPT-SoVITS 推理（需自行启动 API 服务，不中断 llama）
# mode: "llama_lifecycle" = 通过 skills/tts/tts_call.py 调用（停 llama → 推理 → 重启 llama）
tts:
  enabled: true
  mode: "native"
  provider: "gpt-sovits"
  gpt_sovits:
    api_url: "http://127.0.0.1:9880/tts"

# Vision 视觉模型（屏幕观察用）
# 本地 Qwen3.6 不支持视觉，留空则屏幕观察使用纯 OCR 回退
vision:
  enabled: false
  base_url: ""
  api_key: ""
  model: ""
  timeout_seconds: 30

# AI Girlfriend - 路径配置文件 (模板)
# 每个人环境和盘符不同，clone后复制此文件为 config.yaml 并修改路径
#
# 自动配置方式: 运行 quick_setup.ps1 交互式填写
# 手动配置方式: 复制此文件为 config.yaml，修改下面各路径
#
# 重要: ComfyUI 和 GPT-SoVITS 推理引擎已内置在 skills/ 中
# 所以你只需要配置 llama.cpp 路径 + 模型权重目录

# ============================================================
# Headroom SmartCrusher + CCR 上下文压缩
# ============================================================
headroom:
  smart_crusher:
    min_tokens_to_crush: 150
    max_items_after_crush: 10
    first_fraction: 0.3
    last_fraction: 0.1
    variance_threshold: 2.0
    preserve_change_points: true
  ccr:
    max_entries: 500
    ttl_seconds: 300

# ============================================================
# OpenClaw workspace (agent 工作区)
# ============================================================
workspace: "填写 OpenClaw workspace 路径，例如 C:\\Users\\用户名\\.openclaw\\workspace"

# ============================================================
# 媒体输出目录 (用于 qqbot channel 等发送文件)
# ============================================================
media_qqbot_audio: "填写音频输出路径"
media_qqbot_images: "填写图片输出路径"

# ============================================================
# ComfyUI 文生图 (推理引擎已内置 skills/comfyui_core/)
# ============================================================
# ComfyUI Python 环境 (系统Python或虚拟环境，需有 torch + safetensors)
comfyui_python: "填写 Python 路径，例如 C:\\Users\\用户名\\AppData\\Local\\Programs\\Python\\Python310\\python.exe"
# Checkpoint 模型文件目录 (从HF下载的 .safetensors)
comfyui_checkpoints_dir: "填写 checkpoints 目录，例如 D:\\models\\checkpoints"
# 临时输出目录 (PS脚本会将成品copy到media_qqbot_images)
comfyui_temp_output_dir: "填写临时输出目录"

# ============================================================
# GPT-SoVITS v2 Pro TTS (推理引擎已内置 skills/sovits/)
# ============================================================
# Python 环境 (需有 torch>=2.0 + CUDA)
sovits_python: "填写 Python 路径"
# 声优权重文件目录
#   GPT_weights_v2Pro/xxx-e30.ckpt  (从HF下载)
#   SoVITS_weights_v2Pro/xxx_e20_s6240.pth  (从HF下载)
sovits_weights_dir: "填写权重目录，例如 D:\\models\\gpt-sovits-weights"
# GPT-SoVITS 源码根目录 (已内置 skills/sovits/，保留此字段用于兼容)
sovits_root: ""  # 留空 = 使用内置 skills/sovits/
# TTS 输出目录
tts_temp_output_dir: "填写 TTS 临时输出目录"

# ============================================================
# llama.cpp (本地 LLM)
# ============================================================
llama_exe: "填写 llama-server.exe 路径"
llama_model: "填写 GGUF 模型文件路径"
llama_log_dir: "填写 llama 日志输出目录"
restart_script: "填写 llama 重启脚本路径"
llama_port: 8080

# ============================================================
# Memory & Embedding（长期记忆 + 向量数据库 + 文本压缩）
# ============================================================
role_memory_dir: "填写 memory/role_play 路径"
mem0_qdrant_dir: "填写 Qdrant 数据目录"
mem0_bridge: "填写 mem0_bridge.py 路径"
mem0_sync_cron: "填写 mem0_sync_cron.py 路径"
embedding_dir: "填写 embedding 模型缓存路径"
embedding_server: ""

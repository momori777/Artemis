# AI Girlfriend - 路径配置文件 (模板)
# 每个人环境和盘符不同，clone后复制此文件为 config.yaml 并修改路径。
# 自动配置方式: 运行 quick_setup.ps1 交互式填写
# 手动配置方式: 复制此文件为 config.yaml，修改下面各路径
#
# 重要: ComfyUI 和 GPT-SoVITS 推理引擎已内置在 skills/ 中
# 所以你只需要配置 llama.cpp 路径 + 模型权重目录

# ============================================================
# Headroom SmartCrusher + CCR 上下文压缩
# ============================================================
headroom:
  smart_crusher:
    min_tokens_to_crush: 150
    max_items_after_crush: 10
    first_fraction: 0.3
    last_fraction: 0.1
    variance_threshold: 2.0
    preserve_change_points: true
  ccr:
    max_entries: 500
    ttl_seconds: 300

# ============================================================
# OpenClaw workspace (agent 工作区)
# ============================================================
workspace: "C:\\Users\\<你的用户名>\\.openclaw\\workspace"

# ============================================================
# OpenClaw Gateway 启动脚本
# 运行 openclaw gateway --port 18789
# ============================================================
gateway_cmd: "C:\\Users\\<你的用户名>\\.openclaw\\gateway.cmd"
# Node.js 可执行文件 (gateway.cmd 不可用时降级使用)
# node_exe: "C:\\Program Files\\nodejs\\node.exe"

# ============================================================
# 媒体输出目录 (qqbot channel 的发文件目录)
# ============================================================
media_qqbot_audio: "C:\\Users\\<你的用户名>\\.openclaw\\media\\qqbot\\audio"
media_qqbot_images: "C:\\Users\\<你的用户名>\\.openclaw\\media\\qqbot\\images"

# ============================================================
# ComfyUI 文生图
# ============================================================
# ComfyUI Python 环境 (系统Python或虚拟环境，需有 torch + safetensors)
comfyui_python: "填写 Python 路径，例如 C:\\Users\\<你的用户名>\\AppData\\Local\\Programs\\Python\\Python310\\python.exe"
# Checkpoint 模型文件目录 (从HF下载的 .safetensors)
comfyui_checkpoints_dir: "填写 checkpoints 目录，例如 D:\\models\\checkpoints"
# 临时输出目录 (PS脚本会将成品copy到media_qqbot_images)
comfyui_temp_output_dir: "填写临时输出目录"

# ============================================================
# GPT-SoVITS v2 Pro TTS (推理引擎已内置 skills/sovits/)
# ============================================================
# Python 环境 (需有 torch>=2.0 + CUDA)
sovits_python: "填写 Python 路径"
# 声优权重文件目录
#   GPT_weights_v2Pro/xxx-e30.ckpt  (从HF下载)
#   SoVITS_weights_v2Pro/xxx_e20_s6240.pth  (从HF下载)
sovits_weights_dir: "填写权重目录，例如 D:\\models\\gpt-sovits-weights"
# GPT-SoVITS 源码根目录 (已内置 skills/sovits/，保留此字段用于兼容)
sovits_root: ""  # 留空 = 使用内置 skills/sovits/
# TTS 输出目录
tts_temp_output_dir: "填写 TTS 临时输出目录"

# ============================================================
# llama.cpp (本地 LLM)
# ============================================================
llama_exe: "填写 llama-server.exe 路径，例如 D:\\AI_Girlfriend\\llama-server\\llama-server.exe"
llama_model: "填写 GGUF 模型文件路径，例如 E:\\Hermes3.6-35B-A3B-Uncensored-Genesis-V6-APEX-Compact.gguf"
llama_port: 8080
llama_log_dir: "llama-server/restart-logs"
restart_script: "skills/shared/restart_llama_degraded.ps1"

llama:
  context: 120000
  batch_size: 2048
  ubatch_size: 1024
  cache_ram: 5000
  ctk: q8_0
  ctv: q8_0
  threads: 24
  ngl: 41

# ============================================================
# Memory & Embedding（长期记忆 + 向量库）
# ============================================================
role_memory_dir: "C:\\Users\\<你的用户名>\\.openclaw\\workspace\\memory\\role_play"
mem0_qdrant_dir: "C:\\Users\\<你的用户名>\\.openclaw\\workspace\\skills\\sakura\\data\\memory\\qdrant"
mem0_bridge: "C:\\Users\\<你的用户名>\\.openclaw\\workspace\\skills\\shared\\mem0_bridge.py"
mem0_sync_cron: "C:\\Users\\<你的用户名>\\.openclaw\\workspace\\skills\\shared\\mem0_sync_cron.py"
embedding_dir: "填写 embedding 模型缓存路径，例如 C:\\Users\\<你的用户名>\\Desktop\\vllm\\models\\embedding\\all-MiniLM-L6-v2"
embedding_server: "C:\\Users\\<你的用户名>\\.openclaw\\workspace\\skills\\shared\\start_embedding_server.ps1"
